services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-identity}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bazaar-local
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-identity}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  identity-service:
    build:
      context: ../../bazaar-backend/services/identity-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${IDENTITY_SERVICE_PORT:-8080}
      SERVICE_NAME: identity-service
      DEPENDENCY_TARGETS: postgres:5432
    networks:
      - bazaar-local
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -T 2 -O /dev/null http://127.0.0.1:${IDENTITY_SERVICE_PORT:-8080}/livez || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  api-gateway:
    build:
      context: ../../bazaar-backend/api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      identity-service:
        condition: service_healthy
    ports:
      - "${API_GATEWAY_PORT:-8080}:${API_GATEWAY_PORT:-8080}"
    environment:
      PORT: ${API_GATEWAY_PORT:-8080}
      SERVICE_NAME: api-gateway
      IDENTITY_SERVICE_URL: http://identity-service:${IDENTITY_SERVICE_PORT:-8080}
    networks:
      - bazaar-local
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -T 2 -O /dev/null http://127.0.0.1:${API_GATEWAY_PORT:-8080}/livez || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  bazaar-local:
    driver: bridge

volumes:
  postgres-data:
