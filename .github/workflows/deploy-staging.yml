name: Deploy Staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: STAGING
    env:
      REMOTE_DIR: /opt/bazaar-platform/staging
      STAGING_HOST: ${{ vars.STAGING_HOST }}
      STAGING_USER: ${{ vars.STAGING_USER }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      API_GATEWAY_IMAGE: ${{ secrets.API_GATEWAY_IMAGE }}
      IDENTITY_SERVICE_IMAGE: ${{ secrets.IDENTITY_SERVICE_IMAGE }}
      DB_URL: ${{ secrets.STAGING_DB_URL }}
      JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
      CORS_ALLOWED_ORIGINS: ${{ secrets.STAGING_CORS_ALLOWED_ORIGINS }}
      API_GATEWAY_PORT: ${{ secrets.API_GATEWAY_PORT }}
      IDENTITY_SERVICE_PORT: ${{ secrets.IDENTITY_SERVICE_PORT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required environment configuration
        run: |
          required_vars=(
            STAGING_HOST
            STAGING_USER
            API_GATEWAY_IMAGE
            IDENTITY_SERVICE_IMAGE
            DB_URL
            JWT_SECRET
            CORS_ALLOWED_ORIGINS
          )

          for key in "${required_vars[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              printf 'Missing required workflow environment value: %s\n' "$key" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Prepare remote directory structure
        run: |
          ssh "${STAGING_USER}@${STAGING_HOST}" "
            mkdir -p '${REMOTE_DIR}/compose' '${REMOTE_DIR}/scripts/deploy'
          "

      - name: Copy release files
        run: |
          scp compose/docker-compose.release.yml "${STAGING_USER}@${STAGING_HOST}:${REMOTE_DIR}/compose/docker-compose.release.yml"
          scp scripts/deploy/deploy-staging.sh "${STAGING_USER}@${STAGING_HOST}:${REMOTE_DIR}/scripts/deploy/deploy-staging.sh"

      - name: Generate remote .env.staging
        shell: bash
        run: |
          quote_for_env() {
            printf "%s" "$1" | sed "s/'/'\\\\''/g"
          }

          ssh "${STAGING_USER}@${STAGING_HOST}" 'bash -se' <<EOF
          set -euo pipefail
          cd "${REMOTE_DIR}"
          umask 077
          cat > .env.staging <<'ENVFILE'
          GHCR_USERNAME='$(quote_for_env "${GHCR_USERNAME}")'
          GHCR_TOKEN='$(quote_for_env "${GHCR_TOKEN}")'
          API_GATEWAY_IMAGE='$(quote_for_env "${API_GATEWAY_IMAGE}")'
          IDENTITY_SERVICE_IMAGE='$(quote_for_env "${IDENTITY_SERVICE_IMAGE}")'
          DB_URL='$(quote_for_env "${DB_URL}")'
          JWT_SECRET='$(quote_for_env "${JWT_SECRET}")'
          CORS_ALLOWED_ORIGINS='$(quote_for_env "${CORS_ALLOWED_ORIGINS}")'
          API_GATEWAY_PORT='$(quote_for_env "${API_GATEWAY_PORT:-8080}")'
          IDENTITY_SERVICE_PORT='$(quote_for_env "${IDENTITY_SERVICE_PORT:-8080}")'
          ENVFILE
          chmod 600 .env.staging
          EOF

      - name: Make deploy script executable
        run: |
          ssh "${STAGING_USER}@${STAGING_HOST}" "
            chmod +x '${REMOTE_DIR}/scripts/deploy/deploy-staging.sh'
          "

      - name: Run remote deploy
        run: |
          ssh "${STAGING_USER}@${STAGING_HOST}" "
            cd '${REMOTE_DIR}' && ./scripts/deploy/deploy-staging.sh
          "
