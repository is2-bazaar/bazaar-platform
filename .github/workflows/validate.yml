name: Validate Bazaar Platform

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate CI env file
        run: |
          cat > .env.ci <<'EOF'
          API_GATEWAY_IMAGE=ghcr.io/example/bazaar-api-gateway:sha-dummy
          IDENTITY_SERVICE_IMAGE=ghcr.io/example/bazaar-identity-service:sha-dummy
          API_GATEWAY_PORT=8080
          IDENTITY_SERVICE_PORT=8080
          DB_URL='postgresql://user:password@host/db?sslmode=require'
          JWT_SECRET='dummy-jwt-secret'
          CORS_ALLOWED_ORIGINS='https://staging.example.com'
          EOF

      - name: Validate compose syntax
        run: docker compose --env-file .env.ci -f compose/docker-compose.release.yml config

      - name: Validate documented variables
        run: |
          required_keys=(
            STAGING_HOST
            STAGING_USER
            STAGING_DB_URL
            STAGING_JWT_SECRET
            STAGING_CORS_ALLOWED_ORIGINS
            GHCR_USERNAME
            GHCR_TOKEN
            API_GATEWAY_IMAGE
            IDENTITY_SERVICE_IMAGE
          )

          for key in "${required_keys[@]}"; do
            if ! grep -Eq "^${key}=" .env.staging.example; then
              printf 'Missing required key in .env.staging.example: %s\n' "$key" >&2
              exit 1
            fi
          done

      - name: Cleanup CI env file
        if: always()
        run: rm -f .env.ci
