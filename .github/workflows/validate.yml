name: Validate Bazaar Platform

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate CI env file
        run: |
          cat > .env.ci <<'EOF'
          API_GATEWAY_PORT=8080
          IDENTITY_SERVICE_PORT=8080
          POSTGRES_DB=identity
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_PORT=5433
          VITE_API_BASE_URL=http://localhost:8080
          EOF

      - name: Validate compose syntax
        run: docker compose --env-file .env.ci -f compose/docker-compose.local.yml config

      - name: Validate documented local variables
        run: |
          required_keys=(
            API_GATEWAY_PORT
            IDENTITY_SERVICE_PORT
            POSTGRES_DB
            POSTGRES_USER
            POSTGRES_PASSWORD
            POSTGRES_PORT
            VITE_API_BASE_URL
          )

          for key in "${required_keys[@]}"; do
            if ! grep -Eq "^${key}=" .env.local.example; then
              printf 'Missing required key in .env.local.example: %s\n' "$key" >&2
              exit 1
            fi
          done

      - name: Cleanup CI env file
        if: always()
        run: rm -f .env.ci
